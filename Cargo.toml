[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smallsunsun1/xrack"
rust-version = "1.99.1"

[workspace.dependencies]
antlr4rust = "=0.6.0"
clap = { version = "4.6", features = ["derive"] }
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
xrack-parser = { path = "crates/xrack-parser" }
xrack-runtime = { path = "crates/xrack-runtime", version = "0.1.0" }
xrack-assets = { path = "crates/xrack-assets", version = "0.1.0" }
xrack-syntax = { path = "crates/xrack-syntax" }
xrack-ir = { path = "crates/xrack-ir" }
xrack-mlir = { path = "crates/xrack-mlir" }
xrack-codegen = { path = "crates/xrack-codegen" }
xrack-layout = { path = "crates/xrack-layout", version = "0.1.0" }
xrack-renderer-femtovg = { path = "crates/xrack-renderer-femtovg", version = "0.1.0" }
xrack-platform-winit = { path = "crates/xrack-platform-winit", version = "0.1.0" }
femtovg = { version = "=0.28.0", default-features = false, features = ["wgpu", "textlayout"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12"] }
winit = "=0.30.13"
fontdb = "0.23"
ttf-parser = "0.25"
pollster = "1.0"
png = "0.18"
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
gif-dispose = "=6.0.0"
resvg = { version = "=0.49.0", default-features = false }
svgtypes = "0.16.1"
imgref = "1.12"
rgb = "0.8"
unicode-segmentation = "1.13"
unicode-bidi = "0.3.18"
pulldown-cmark = { version = "=0.13.6", default-features = false }
