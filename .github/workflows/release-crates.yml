name: Release XRack

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version to release
        required: true
        type: string
      publish:
        description: Publish an existing release tag from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: xrack-release
  cancel-in-progress: false

env:
  XRACK_RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
      marketplace: ${{ steps.source.outputs.marketplace }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release source
        id: source
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          commit=$(git rev-parse HEAD)
          tag="v${XRACK_RELEASE_VERSION#v}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a version tag such as v0.5.0."
            exit 1
          fi
          if [[ "$PUBLISH" == true ]]; then
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::Dispatch an existing tag release from main."
              exit 1
            fi
            commit=$(git rev-parse --verify "refs/tags/${tag}^{commit}")
            if ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "::error::The release tag must point to a commit on main."
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == push && "$commit" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::The release tag moved after the workflow started."
              exit 1
            fi
          fi
          marketplace=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            python3 tools/package_vscode.py check-tag "$tag"
            marketplace=true
          fi
          printf 'commit=%s\ntag=%s\nmarketplace=%s\n' "$commit" "$tag" "$marketplace" >> "$GITHUB_OUTPUT"
      - name: Install Linux desktop build dependencies
        run: bash tools/install_ci_linux_deps.sh
      - name: Verify crate release
        env:
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
        run: |
          git switch --detach "$SOURCE_SHA"
          python3 tools/publish_crates.py -- "${XRACK_RELEASE_VERSION#v}"

  build:
    if: github.event_name == 'push' || inputs.publish
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      source-sha: ${{ needs.verify.outputs.commit }}
      package-vsix: ${{ needs.verify.outputs.marketplace == 'true' }}

  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: xrackc-*
          merge-multiple: true
          path: .tools/release
      - name: Verify the Cargo release graph with all five compiler bundles
        run: python3 tools/publish_crates.py --archives .tools/release -- "${XRACK_RELEASE_VERSION#v}"
      - name: Publish verified crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 tools/publish_crates.py --publish --archives .tools/release -- "${XRACK_RELEASE_VERSION#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          files=(.tools/release/xrackc-*.tar.gz .tools/release/xrackc-*.tar.gz.sha256)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes "${options[@]}"
          fi

  publish-vscode:
    if: needs.verify.outputs.marketplace == 'true'
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: vscode-vsix-*
          merge-multiple: true
          path: .tools/vsix-release
      - name: Verify all five VSIX files and publish with OIDC
        shell: bash
        run: |
          retry=()
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            retry=(--skip-duplicate)
          fi
          python3 tools/package_vscode.py publish "$GITHUB_REF_NAME" \
            --packages .tools/vsix-release "${retry[@]}"
