name: Release crates to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version to release
        required: true
        type: string
      publish:
        description: Upload verified crates to crates.io
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

env:
  XRACK_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check publish branch
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Publishing requires the main branch."
          exit 1
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libwayland-dev libxkbcommon-dev
      - name: Verify crate release
        run: python3 tools/publish_crates.py -- "$XRACK_RELEASE_VERSION"

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Publish verified crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 tools/publish_crates.py --publish -- "$XRACK_RELEASE_VERSION"
