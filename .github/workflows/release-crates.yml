name: Release XRack

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xrack-release
  cancel-in-progress: false

env:
  XRACK_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The release tag must point to a commit on main."
            exit 1
          fi
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libwayland-dev libxkbcommon-dev
      - name: Verify crate release
        run: python3 tools/publish_crates.py -- "${XRACK_RELEASE_VERSION#v}"

  build:
    if: github.event_name == 'push'
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.event_name == 'push'
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: xrackc-*
          merge-multiple: true
          path: .tools/release
      - name: Verify the Cargo release graph with all five compiler bundles
        run: python3 tools/publish_crates.py --archives .tools/release -- "${XRACK_RELEASE_VERSION#v}"
      - name: Publish verified crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 tools/publish_crates.py --publish --archives .tools/release -- "${XRACK_RELEASE_VERSION#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(.tools/release/xrackc-*.tar.gz .tools/release/xrackc-*.tar.gz.sha256)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            options=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes "${options[@]}"
          fi
