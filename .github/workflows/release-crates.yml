name: Release XRack

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version to release
        required: true
        type: string
      publish:
        description: Publish an existing release tag from main
        type: boolean
        default: false
      publish-vscode-only:
        description: Publish the verified VSIX packages for an existing stable Cargo release
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: xrack-release
  cancel-in-progress: false

env:
  XRACK_RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
      marketplace: ${{ steps.source.outputs.marketplace }}
      ci-run: ${{ steps.source.outputs.ci-run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish || inputs.publish-vscode-only }}
          VSCODE_ONLY: ${{ inputs.publish-vscode-only == true }}
        run: |
          commit=$(git rev-parse HEAD)
          tag="v${XRACK_RELEASE_VERSION#v}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a version tag such as v0.5.0."
            exit 1
          fi
          if [[ "$PUBLISH" == true ]]; then
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::Dispatch an existing tag release from main."
              exit 1
            fi
            commit=$(git rev-parse --verify "refs/tags/${tag}^{commit}")
            if ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "::error::The release tag must point to a commit on main."
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == push && "$commit" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::The release tag moved after the workflow started."
              exit 1
            fi
          fi
          git switch --detach "$commit"
          if [[ "$VSCODE_ONLY" == true && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Marketplace publishing requires a stable release tag."
            exit 1
          fi
          marketplace=false
          ci_run=
          if [[ "$PUBLISH" == true && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            python3 tools/package_vscode.py check-tag "$tag"
            ci_run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=main -f event=push -f status=success -f head_sha="$commit" \
              --jq '.workflow_runs[0].id // empty')
            if [[ -z "$ci_run" ]]; then
              echo "::error::The release commit must pass CI on main before publishing."
              exit 1
            fi
            marketplace=true
          fi
          if [[ "$VSCODE_ONLY" == true ]]; then
            release_run=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/release-crates.yml/runs" \
              -f branch="$tag" -f event=push -f status=success -f head_sha="$commit" \
              --jq '.workflow_runs[0].id // empty')
            if [[ -z "$release_run" ]] || ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$release_run/jobs" \
              --jq '.jobs[] | select(.name == "publish" and .conclusion == "success") | .name' | grep -qx publish; then
              echo "::error::The tag must already have a successful Cargo publication."
              exit 1
            fi
          fi
          printf 'commit=%s\ntag=%s\nmarketplace=%s\nci-run=%s\n' "$commit" "$tag" "$marketplace" "$ci_run" >> "$GITHUB_OUTPUT"
      - name: Install Linux desktop build dependencies
        if: '!inputs.publish-vscode-only'
        run: bash tools/install_ci_linux_deps.sh
      - name: Verify crate release
        if: '!inputs.publish-vscode-only'
        run: python3 tools/publish_crates.py -- "${XRACK_RELEASE_VERSION#v}"

  build:
    if: (github.event_name == 'push' || inputs.publish) && !inputs.publish-vscode-only && needs.verify.outputs.ci-run == ''
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      source-sha: ${{ needs.verify.outputs.commit }}

  publish:
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      (needs.verify.outputs.ci-run != '' || needs.build.result == 'success') &&
      (github.event_name == 'push' || inputs.publish) && !inputs.publish-vscode-only
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    env:
      XRACK_RELEASE_SOURCE_ROOT: ${{ github.workspace }}
      RELEASE_TOOLING: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && '.tools/release-tooling/tools/publish_crates.py' || 'tools/publish_crates.py' }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - name: Checkout updated tooling for the existing tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          path: .tools/release-tooling
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ needs.verify.outputs.ci-run != '' && github.token || '' }}
          run-id: ${{ needs.verify.outputs.ci-run || github.run_id }}
          pattern: xrackc-*
          merge-multiple: true
          path: .tools/release
      - name: Verify the Cargo release graph with all five compiler bundles
        run: python3 "$RELEASE_TOOLING" --archives .tools/release -- "${XRACK_RELEASE_VERSION#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          files=(.tools/release/xrackc-*.tar.gz .tools/release/xrackc-*.tar.gz.sha256 .tools/release/xrack-media-source-*.tar.gz)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes "${options[@]}"
          fi
      - name: Publish verified crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 "$RELEASE_TOOLING" --publish --archives .tools/release -- "${XRACK_RELEASE_VERSION#v}"

  publish-vscode:
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.verify.outputs.marketplace == 'true' &&
      (inputs.publish-vscode-only || needs.publish.result == 'success')
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: vscode-marketplace
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify.outputs.ci-run }}
          pattern: vscode-vsix-*
          merge-multiple: true
          path: .tools/vsix-release
      - name: Verify all five VSIX files and publish with OIDC
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          retry=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || (( GITHUB_RUN_ATTEMPT > 1 )); then
            retry=(--skip-duplicate)
          fi
          python3 tools/package_vscode.py publish "$RELEASE_TAG" \
            --packages .tools/vsix-release "${retry[@]}"
