name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Cargo runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libwayland-dev libxkbcommon-dev
      - name: Select native Rust on Windows arm64
        if: matrix.os == 'windows-11-arm'
        run: rustup set default-host aarch64-pc-windows-msvc
      - name: Test Cargo runtime and desktop host
        run: >-
          cargo test --locked
          -p xrack-runtime -p xrack-assets -p xrack-layout
          -p xrack-renderer-femtovg -p xrack-platform-winit
      - name: Verify publishable crates
        if: matrix.os == 'ubuntu-24.04'
        run: >-
          cargo package --locked
          -p xrack-runtime -p xrack-assets -p xrack-layout
          -p xrack-renderer-femtovg -p xrack-platform-winit
      - name: Upload Cargo packages
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-packages
          path: .tools/cargo-build/package/*.crate
          include-hidden-files: true
          if-no-files-found: error

  compiler:
    name: Bazel compiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      CARGO_BAZEL_ISOLATED: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Configure Windows shell and clang-cl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "BAZEL_SH=C:/msys64/usr/bin/bash.exe" >> $env:GITHUB_ENV
          "BAZEL_LLVM=$env:ProgramFiles/LLVM" >> $env:GITHUB_ENV
      - name: Select native Rust on Windows arm64
        if: matrix.os == 'windows-11-arm'
        run: rustup set default-host aarch64-pc-windows-msvc
      - name: Check compiler packaging host
        shell: bash
        env:
          XRACK_TARGET: ${{ matrix.target }}
        run: |
          rustc -vV | tr -d '\r' | grep -Fx "host: $XRACK_TARGET"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: |
            - .bazelversion
            - MODULE.bazel
            - Cargo.lock
          disk-cache: true
          bazelrc: |
            build --jobs=${{ runner.os == 'macOS' && '3' || '4' }}
      - name: Check Rust formatting through Bazel
        if: runner.os == 'macOS'
        run: |
          bazel build --config=fmt --lockfile_mode=update //... //tests:gpu_test
          bazel run @xrack_rust_host_tools//:rustfmt -- --check --edition 2024 \
            "$GITHUB_WORKSPACE/examples/cargo-consumer/build.rs" \
            "$GITHUB_WORKSPACE/examples/cargo-consumer/src/main.rs"
      - name: Test compiler, MLIR passes, and generated Rust
        # Bazel extension digests can differ between the local installation and hosted runners.
        run: >-
          bazel test --announce_rc --lockfile_mode=update
          //tests:compiler_test //tests:mlir_pass_test //tests:expressions_test
          //crates/xrack-lsp:xrack_lsp_test
      - name: Run Clippy through Bazel
        if: runner.os == 'macOS'
        run: bazel build --config=lint --lockfile_mode=error //... //tests:gpu_test
      - name: Check the Cargo dependency lock
        run: git diff --exit-code -- Cargo.lock
      - name: Package xrackc
        run: python tools/package_xrackc.py
      - name: Run the standalone Cargo consumer
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tarfile
          import tempfile
          import tomllib

          runtime = Path("crates/xrack-runtime").resolve()
          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          archive, = Path(".tools/dist").glob("xrackc-*.tar.gz")
          with tempfile.TemporaryDirectory() as directory:
              stage = Path(directory)
              with tarfile.open(archive) as bundle:
                  bundle.extractall(stage, filter="data")
              exe = "xrackc.exe" if os.name == "nt" else "xrackc"
              compiler = stage / archive.name.removesuffix(".tar.gz") / exe
              app = stage / "app"
              shutil.copytree("examples/cargo-consumer", app)
              result = subprocess.run(
                  ["cargo", "run", "--config",
                   f"patch.crates-io.xrack-runtime.path={json.dumps(runtime.as_posix())}"],
                  cwd=app, check=True, text=True, stdout=subprocess.PIPE,
                  env={**os.environ, "XRACKC": str(compiler), "RUSTUP_TOOLCHAIN": toolchain},
              )
              print(result.stdout, end="")
              if result.stdout.strip() != "count=1, doubled=2":
                  raise SystemExit("unexpected Cargo consumer output")
      - name: Upload xrackc archive and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xrackc-${{ matrix.os }}
          path: |
            .tools/dist/xrackc-*.tar.gz
            .tools/dist/xrackc-*.sha256
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
