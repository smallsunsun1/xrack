name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package-vsix:
        description: Build and smoke-test the five VSIX packages
        type: boolean
        default: false
  workflow_call:
    inputs:
      source-sha:
        description: Exact source commit to test and package
        type: string
        default: ''
      package-vsix:
        description: Build and smoke-test a native VS Code extension package for each compiler host
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.source-sha || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Cargo runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: bash tools/install_ci_linux_deps.sh
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: inputs.source-sha && inputs.source-sha != github.sha
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Select native Rust on Windows arm64
        if: matrix.os == 'windows-11-arm'
        run: rustup set default-host aarch64-pc-windows-msvc
      - name: Test Cargo runtime and desktop host
        run: >-
          cargo test --release --locked -p xrack-build
          -p xrack-runtime -p xrack-assets -p xrack-layout
          -p xrack-renderer-femtovg -p xrack-platform-winit -p xrack
      - name: Verify publishable crates
        if: matrix.os == 'ubuntu-24.04'
        run: >-
          cargo package --locked
          -p xrack-runtime -p xrack-assets -p xrack-layout
          -p xrack-renderer-femtovg
      - name: Upload Cargo packages
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-packages
          path: .tools/cargo-build/package/*.crate
          include-hidden-files: true
          if-no-files-found: error

  compiler:
    name: Bazel compiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      CARGO_BAZEL_ISOLATED: "false"
      PACKAGE_VSIX: ${{ inputs.package-vsix || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
      - name: Configure Windows shell and SDK license settings
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: ${{ vars.BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA }}
          BAZEL_WINDOWS_SDK_EULA: ${{ vars.BAZEL_WINDOWS_SDK_EULA }}
        run: |
          if ($env:BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA -ne '1' -or $env:BAZEL_WINDOWS_SDK_EULA -ne '1') {
            throw 'Set BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA and BAZEL_WINDOWS_SDK_EULA to 1 after confirming the Microsoft licenses.'
          }
          "BAZEL_SH=C:/msys64/usr/bin/bash.exe" >> $env:GITHUB_ENV
          "BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA=$env:BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA" >> $env:GITHUB_ENV
          "BAZEL_WINDOWS_SDK_EULA=$env:BAZEL_WINDOWS_SDK_EULA" >> $env:GITHUB_ENV
      - name: Select native Rust on Windows arm64
        if: matrix.os == 'windows-11-arm'
        run: rustup set default-host aarch64-pc-windows-msvc
      - name: Check compiler packaging host
        shell: bash
        env:
          XRACK_TARGET: ${{ matrix.target }}
        run: |
          rustc -vV | tr -d '\r' | grep -Fx "host: $XRACK_TARGET"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: |
            - .bazelversion
            - MODULE.bazel
            - Cargo.lock
          disk-cache: true
          # PR merge refs and release tags can restore main's cache.
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          bazelrc: |
            build --jobs=${{ runner.os == 'macOS' && '3' || '4' }}
            build --experimental_disk_cache_gc_max_size=100G
      - name: Check Rust formatting through Bazel
        if: runner.os == 'macOS'
        run: |
          bazel build --config=fmt --lockfile_mode=update //... //tests:gpu_test
          bazel run @xrack_rust_host_tools//:rustfmt -- --check --edition 2024 \
            "$GITHUB_WORKSPACE/examples/cargo-consumer/build.rs" \
            "$GITHUB_WORKSPACE/examples/cargo-consumer/src/main.rs"
      - name: Test compiler, MLIR passes, and generated Rust
        # Bazel extension digests can differ between the local installation and hosted runners.
        run: >-
          bazel test --announce_rc --lockfile_mode=update
          //tests:compiler_test //tests:mlir_pass_test //tests:expressions_test
          //tests:mlir_filecheck_test //tests:mlir_lsp_test //tests:ui_log_test //tests:interpreter_parity_test
          //crates/xrack-interpreter:interpreter_test
          //crates/xrack-preview:preview_test //crates/xrack-lsp:xrack_lsp_test
      - name: Test media decoding, synchronization, and seeking
        run: >-
          bazel test --config=media --lockfile_mode=update --nocache_test_results
          //crates/xrack-media:media_test //tests:media_player_test
      - name: Run Clippy through Bazel
        if: runner.os == 'macOS'
        run: bazel build --config=lint --lockfile_mode=error //... //tests:gpu_test
      - name: Check the Cargo dependency lock
        run: git diff --exit-code -- Cargo.lock
      - name: Package xrackc
        run: python tools/package_xrackc.py
      - name: Run the standalone Cargo consumer with the bundled compiler
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.tools/cargo-consumer
        run: python tools/test_cargo_consumer.py .tools/dist ${{ matrix.target }}
      - name: Load MLIR from a standalone Cargo consumer
        if: hashFiles('bundles/mlir/build.rs') != ''
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.tools/cargo-consumer
        run: python tools/test_cargo_consumer.py .tools/dist ${{ matrix.target }} --interpreter
      - name: Run the standalone Cargo media consumer
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.tools/cargo-consumer
        run: python tools/test_cargo_consumer.py .tools/dist ${{ matrix.target }} --media
      - name: Upload xrackc archive and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xrackc-${{ matrix.os }}
          path: |
            .tools/dist/xrackc-*.tar.gz
            .tools/dist/xrackc-*.sha256
            .tools/dist/xrack-media-source-*.tar.gz
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.PACKAGE_VSIX == 'true'
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test the VS Code preview queue
        if: env.PACKAGE_VSIX == 'true'
        run: node --test crates/xrack-lsp/vscode/preview-queue.test.js
      - name: Package and smoke-test the native VSIX
        if: env.PACKAGE_VSIX == 'true'
        run: >-
          python tools/package_vscode.py package
          --host ${{ matrix.target }}
          --archives .tools/dist
          --output .tools/vsix
      - name: Upload the native VSIX
        if: env.PACKAGE_VSIX == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-vsix-${{ matrix.target }}
          overwrite: true
          path: .tools/vsix/*.vsix
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
