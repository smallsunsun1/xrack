name: Release XRack for VS Code

on:
  push:
    tags: ['vscode-v[0-9]*']

permissions:
  contents: read

concurrency:
  group: xrack-vscode-marketplace
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and version
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The VS Code release tag must point to a commit on main."
            exit 1
          fi
          python3 tools/package_vscode.py check-tag "$GITHUB_REF_NAME"

  build:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      package-vsix: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: vscode-vsix-*
          merge-multiple: true
          path: .tools/vsix-release
      - name: Verify all five VSIX files and publish with OIDC
        shell: bash
        run: |
          retry=()
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            retry=(--skip-duplicate)
          fi
          python3 tools/package_vscode.py publish "$GITHUB_REF_NAME" \
            --packages .tools/vsix-release "${retry[@]}"
