name: Publish five verified XRack 0.6.0 wheels

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xrack-pypi-v0.6.0
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.6.0
  RELEASE_COMMIT: 26df03df96673c6eeb70fa60aca0b2c858e740e1
  WHEEL_RUN: '43783390267'

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-ids: ${{ steps.artifacts.outputs.ids }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/v0.6.0
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release commit and existing wheel artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WHEEL_RUN" |
            jq -e --arg sha "$RELEASE_COMMIT" '
              .head_sha == $sha and .event == "push" and .head_branch == "main"
              and .path == ".github/workflows/python.yml"
            ' >/dev/null
          ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WHEEL_RUN/artifacts" | jq -er '
            [
              "xrack-python-aarch64-apple-darwin",
              "xrack-python-aarch64-pc-windows-msvc",
              "xrack-python-aarch64-unknown-linux-gnu",
              "xrack-python-x86_64-pc-windows-msvc",
              "xrack-python-x86_64-unknown-linux-gnu"
            ] as $expected
            | [.artifacts[] | select(.expired == false and (.name as $name | $expected | index($name)))]
            | select((map(.name) | sort) == ($expected | sort))
            | map(.id | tostring) | join(",")
          ')"
          printf 'ids=%s\n' "$ids" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/v0.6.0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.WHEEL_RUN }}
          artifact-ids: ${{ needs.verify.outputs.artifact-ids }}
          merge-multiple: true
          path: .tools/python-dist
      - name: Verify the five approved release wheels
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "bindings/python")
          from package_wheel import MATRIX, verify_wheel, version

          release_version = version()
          if f"v{release_version}" != os.environ["RELEASE_TAG"]:
              raise SystemExit("The wheel version must match the release tag")
          wheels = set(Path(".tools/python-dist").glob("*.whl"))
          for target, (_, platform) in MATRIX.items():
              if target == "x86_64-apple-darwin":
                  continue
              matches = [wheel for wheel in wheels
                         if platform in wheel.stem.rsplit("-", 1)[1].split(".")]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one wheel for {platform}")
              verify_wheel(matches[0], release_version, platform)
              wheels.remove(matches[0])
          if wheels:
              raise SystemExit(f"Unexpected wheels: {sorted(w.name for w in wheels)}")
          PY
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: .tools/python-dist/
