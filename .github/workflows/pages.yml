name: Project site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'docs/**'
      - 'grammar/**'
      - 'crates/xrack-ir/**'
      - 'crates/xrack-lsp/BUILD.bazel'
      - 'crates/xrack-lsp/src/catalog.rs'
      - 'crates/xrack-parser/**'
      - 'crates/xrack-syntax/**'
      - 'bazel/**'
      - '.bazelrc'
      - '.bazelversion'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'docs/**'
      - 'grammar/**'
      - 'crates/xrack-ir/**'
      - 'crates/xrack-lsp/BUILD.bazel'
      - 'crates/xrack-lsp/src/catalog.rs'
      - 'crates/xrack-parser/**'
      - 'crates/xrack-syntax/**'
      - 'bazel/**'
      - '.bazelrc'
      - '.bazelversion'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
      - name: Build and unpack the site
        run: |
          bazel build --repo_env=CARGO_BAZEL_ISOLATED=false --lockfile_mode=error //site:pages
          bazel_bin="$(bazel info --repo_env=CARGO_BAZEL_ISOLATED=false --lockfile_mode=error bazel-bin)"
          unzip -q "$bazel_bin/site/xrack-pages.zip" -d "$RUNNER_TEMP/xrack-pages"
          test -s "$RUNNER_TEMP/xrack-pages/index.html"
          test -s "$RUNNER_TEMP/xrack-pages/reference.html"
      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/xrack-pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
