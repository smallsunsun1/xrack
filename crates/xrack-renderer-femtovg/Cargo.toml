[package]
name = "xrack-renderer-femtovg"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "FemtoVG and wgpu rendering for XRack UI"

[dependencies]
xrack-runtime.workspace = true
xrack-layout.workspace = true
xrack-assets.workspace = true
femtovg.workspace = true
parley = { version = "=0.12.0", features = ["complex-scripts"] }
rustybuzz.workspace = true
self_cell = "=1.3.0"
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
wgpu = { workspace = true, features = ["trace"] }
wgpu-core = { version = "=30.0.1", features = ["trace"] }
ron = "0.12"
serde_json.workspace = true
tracing.workspace = true
fontdb.workspace = true
ttf-parser.workspace = true
pollster.workspace = true
png.workspace = true
imgref.workspace = true
rgb.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFString", "std"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPath", "std"] }
objc2-core-text = { version = "=0.3.2", default-features = false, features = ["CTFont", "CTFontDescriptor", "CTFontTraits", "objc2-core-graphics", "std"] }


[[bin]]
name = "xrack-gpu-trace"
path = "src/bin/gpu_trace.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(xrack_femtovg_glyph_samples)"] }
