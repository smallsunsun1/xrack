[package]
name = "xrack-renderer-femtovg"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "FemtoVG and wgpu rendering for XRack UI"

[dependencies]
xrack-runtime.workspace = true
xrack-layout.workspace = true
xrack-assets.workspace = true
femtovg.workspace = true
wgpu.workspace = true
fontdb.workspace = true
pollster.workspace = true
png.workspace = true
imgref.workspace = true
rgb.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFString", "std"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGPath", "std"] }
objc2-core-text = { version = "=0.3.2", default-features = false, features = ["CTFont", "CTFontTraits", "objc2-core-graphics", "std"] }
