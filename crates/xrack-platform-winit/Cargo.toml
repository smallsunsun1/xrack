[package]
name = "xrack-platform-winit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Native winit windows, input, and accessibility for XRack UI"

[features]
media = ["dep:xrack-media"]

[dependencies]
xrack-media = { path = "../xrack-media", version = "=0.8.0", default-features = false, features = ["ffmpeg"], optional = true }
accesskit = "=0.25.2"
accesskit_winit = "=0.34.2"
xrack-runtime.workspace = true
xrack-assets.workspace = true
xrack-layout.workspace = true
xrack-renderer-femtovg.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
unicode-segmentation.workspace = true
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["native-activity"] }
jni = { version = "=0.22.4", default-features = false }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["sync"] }
winit = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(target_os = "ios")'.dependencies]
accesskit_ios = "=0.2.2"
block2 = "=0.5.1"
objc2 = "=0.5.3"
objc2-foundation = { version = "=0.2.2", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSFileCoordinator", "NSFileManager", "NSFormatter", "NSItemProvider", "NSProgress", "NSURL", "NSNotification", "NSNumberFormatter", "NSObject", "NSOperation", "NSProcessInfo", "NSString", "NSThread", "NSUndoManager", "NSValue", "block2"] }
objc2-ui-kit = { version = "=0.2.2", default-features = false, features = ["NSItemProvider_UIKitAdditions", "UIAccessibility", "UIAccessibilityCustomAction", "UIAccessibilityContainer", "UIAction", "UIActivity", "UIActivityViewController", "UIAlertController", "UIBarButtonItem", "UIBarItem", "UIBezierPath", "UIColor", "UIColorPickerViewController", "UIControl", "UIContentSizeCategory", "UIDocumentPickerViewController", "UIDragInteraction", "UIDragItem", "UIDragPreview", "UIDragSession", "UIDropInteraction", "UIInteraction", "UIEditMenuInteraction", "UIEvent", "UIFontMetrics", "UIGeometry", "UIGestureRecognizer", "UIGestureRecognizerSubclass", "UIHoverGestureRecognizer", "UIHoverStyle", "UIInterface", "UIKey", "UIKeyConstants", "UICommand", "UIPress", "UIPressesEvent", "UIKeyboardLayoutGuide", "UILabel", "UILayoutGuide", "UILongPressGestureRecognizer", "UIMenu", "UIMenuElement", "UIPanGestureRecognizer", "UIPasteboard", "UIPinchGestureRecognizer", "UIPointerAccessory", "UIPointerInteraction", "UIPointerRegion", "UIPointerStyle", "UIPopoverPresentationController", "UIPresentationController", "UIResponder", "UIRotationGestureRecognizer", "UIScrollView", "UITextField", "UITextInput", "UITextInputTraits", "UITextView", "UIToolbar", "UITouch", "UITrackingLayoutGuide", "UITraitCollection", "UIView", "UIViewController", "UIViewControllerTransitionCoordinator", "UIWindow", "block2", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = { version = "=0.2.2", default-features = false, features = ["UTCoreTypes", "UTType"] }
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["sync"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rfd = "=0.18.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSBitmapImageRep", "NSButton", "NSCell", "NSControl", "NSDragging", "NSGraphics", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSData", "NSGeometry", "NSString", "NSURL"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-lite = "=2.6.1"
tokio = { version = "=1.54.1", features = ["sync"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time"] }
