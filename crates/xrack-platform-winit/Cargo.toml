[package]
name = "xrack-platform-winit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Native winit windows, input, and accessibility for XRack UI"

[dependencies]
accesskit = "=0.25.2"
accesskit_winit = "=0.34.2"
xrack-runtime.workspace = true
xrack-layout.workspace = true
xrack-renderer-femtovg.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
unicode-segmentation.workspace = true
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rfd = "=0.18.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSDragging", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time"] }
