[package]
name = "xrack-build"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Compile XRack UI files from a Cargo build script"

[features]
default = ["bundled"]
bundled = [
    "dep:flate2",
    "dep:xrackc-bin-aarch64-apple-darwin",
    "dep:xrackc-bin-aarch64-unknown-linux-gnu",
    "dep:xrackc-bin-x86_64-unknown-linux-gnu",
    "dep:xrackc-bin-aarch64-pc-windows-msvc",
    "dep:xrackc-bin-x86_64-pc-windows-msvc",
]

[dependencies]
flate2 = { workspace = true, optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
xrackc-bin-aarch64-apple-darwin = { path = "../../compiler-bundles/aarch64-apple-darwin", version = "=0.2.0", optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64", target_env = "gnu"))'.dependencies]
xrackc-bin-aarch64-unknown-linux-gnu = { path = "../../compiler-bundles/aarch64-unknown-linux-gnu", version = "=0.2.0", optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
xrackc-bin-x86_64-unknown-linux-gnu = { path = "../../compiler-bundles/x86_64-unknown-linux-gnu", version = "=0.2.0", optional = true }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64", target_env = "msvc"))'.dependencies]
xrackc-bin-aarch64-pc-windows-msvc = { path = "../../compiler-bundles/aarch64-pc-windows-msvc", version = "=0.2.0", optional = true }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64", target_env = "msvc"))'.dependencies]
xrackc-bin-x86_64-pc-windows-msvc = { path = "../../compiler-bundles/x86_64-pc-windows-msvc", version = "=0.2.0", optional = true }
