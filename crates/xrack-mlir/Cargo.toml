[package]
name = "xrack-mlir"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "XRack mlir support"

[dependencies]
serde_json.workspace = true
xrack-syntax.workspace = true
xrack-ir.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(xrack_bazel)'] }

[features]
bundled = [
    "dep:xrack-mlir-bin-aarch64-apple-darwin",
    "dep:xrack-mlir-bin-aarch64-unknown-linux-gnu",
    "dep:xrack-mlir-bin-x86_64-unknown-linux-gnu",
    "dep:xrack-mlir-bin-aarch64-pc-windows-msvc",
    "dep:xrack-mlir-bin-x86_64-pc-windows-msvc",
]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
xrack-mlir-bin-aarch64-apple-darwin = { path = "../../bundles/mlir/aarch64-apple-darwin", version = "=0.5.1", optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64", target_env = "gnu"))'.dependencies]
xrack-mlir-bin-aarch64-unknown-linux-gnu = { path = "../../bundles/mlir/aarch64-unknown-linux-gnu", version = "=0.5.1", optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
xrack-mlir-bin-x86_64-unknown-linux-gnu = { path = "../../bundles/mlir/x86_64-unknown-linux-gnu", version = "=0.5.1", optional = true }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64", target_env = "msvc"))'.dependencies]
xrack-mlir-bin-aarch64-pc-windows-msvc = { path = "../../bundles/mlir/aarch64-pc-windows-msvc", version = "=0.5.1", optional = true }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64", target_env = "msvc"))'.dependencies]
xrack-mlir-bin-x86_64-pc-windows-msvc = { path = "../../bundles/mlir/x86_64-pc-windows-msvc", version = "=0.5.1", optional = true }
