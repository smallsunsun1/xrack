[package]
name = "xrack-scene-import"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Load OBJ, glTF, and heightfield assets for XRack 3D"

[dependencies]
base64 = "0.22"
bevy_mikktspace = "=1.0.0"
draco-core = { version = "=2.5.1", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
flate2.workspace = true
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "extensions", "extras", "KHR_materials_unlit"] }
image-webp = "=0.2.4"
jpeg-decoder = { version = "=0.3.2", default-features = false }
nalgebra.workspace = true
png.workspace = true
rmeshopt = "=0.1.3"
serde.workspace = true
serde_json.workspace = true
xrack-assets.workspace = true
xrack-runtime.workspace = true
xrack-syntax.workspace = true
