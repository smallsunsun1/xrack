[package]
name = "xrack-inspection-workbench"
version = "0.7.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }
xrack = "=0.7.0"

[build-dependencies]
xrack-build = "=0.7.0"

[dev-dependencies]
pollster = "1.0"
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12"] }
xrack-testing = "=0.7.0"
