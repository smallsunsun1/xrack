# Try Google's regional CDN for large NDK archives, then the original host.
# Bazel still checks the pinned archive integrity from the toolchain module.
rewrite dl\.google\.com/android/repository/(android-ndk-[^/?]+\.zip) redirector.gvt1.com/edgedl/android/repository/$1
rewrite dl\.google\.com/android/repository/(android-ndk-[^/?]+\.zip) dl.google.com/android/repository/$1
